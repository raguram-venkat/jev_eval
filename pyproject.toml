[project]
name = "twinbench"
version = "0.1.0"
description = "Reproducible CLI benchmark for Jev (TypeSafe AI System One) typed decisions"
readme = "README.md"
authors = [
    { name = "Raguram", email = "raguram4123@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.scripts]
twinbench = "twinbench.cli:main"

[dependency-groups]
dev = [
    "datasets>=5.0.1",
]

[tool.uv.build-backend]
module-name = "twinbench"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
